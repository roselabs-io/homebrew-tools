name: homebrew-tools PM sync

# Runs `governor-ticket-sync` of the Governor package with `tickets.*` of pipeline.yaml: every issue
# with a `homebrewtools-pm` block is added to the organization project `Governor` (number 2, `tickets.project` of pipeline.yaml), with its fields set from the
# block. A PR's `Homebrewtools-Issue: #N` line moves issue N to In progress (draft) or Review (ready), and a
# merge into `main` closes it as Done.
#
# `GOVERNOR_PM_TOKEN` is a secret of the shared Bitwarden project whose id is the organization variable
# `BWS_SHARED_PROJECT_ID`: a token that can read and write the organization's projects and the repository's issues,
# and read the Governor package repository. The job reads it with `bws`, authenticated by the secret
# `BWS_ACCESS_TOKEN`, into the environment of the steps after it. `github.token` cannot write an organization project.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homebrewtools-pm.yml'
      - 'pipeline.yaml'
  issues:
    types: [opened, edited, closed, reopened, milestoned, demilestoned]
  pull_request:
    types: [opened, reopened, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:

concurrency:
  # Issue events share one group per repository and cancel the run before them; each run syncs every issue
  # updated since the last successful issue-event run, so a burst of edits costs one or two runs. A PR event
  # moves its issue from the event itself, so each PR has its own group and its runs are not cancelled.
  group: ${{ github.event_name == 'issues' && 'homebrewtools-pm' || format('homebrewtools-pm-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

jobs:
  sync:
    # A pull request from a fork receives no secret, `BWS_ACCESS_TOKEN` included; the job does not run on one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    env:
      PIPELINE_CONFIG: ${{ github.workspace }}/pipeline.yaml
    steps:
      - uses: actions/checkout@v7

      # `bws` 2.1.0 for x86_64 Linux, the architecture of `ubuntu-latest`, from the releases of bitwarden/sdk-sm,
      # checked against its SHA-256 and run from $RUNNER_TEMP.
      - name: Install bws
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bws.zip" https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  $RUNNER_TEMP/bws.zip" | sha256sum --check --quiet
          python3 -m zipfile -e "$RUNNER_TEMP/bws.zip" "$RUNNER_TEMP/bws"
          chmod +x "$RUNNER_TEMP/bws/bws"
          echo "$RUNNER_TEMP/bws" >> "$GITHUB_PATH"

      # Masked, then in the environment of the later steps: actions/checkout and the sync read it.
      - name: Read GOVERNOR_PM_TOKEN from Bitwarden Secrets Manager
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ vars.BWS_SHARED_PROJECT_ID }}
        run: |
          # The variables expand in the shell `bws run` starts, where the secrets are set.
          # shellcheck disable=SC2016
          bws run --project-id "$BWS_PROJECT_ID" -- '
            test -n "$GOVERNOR_PM_TOKEN" || { echo "::error::GOVERNOR_PM_TOKEN is not in the Bitwarden project $BWS_PROJECT_ID"; exit 1; }
            echo "::add-mask::$GOVERNOR_PM_TOKEN"
            echo "GOVERNOR_PM_TOKEN=$GOVERNOR_PM_TOKEN" >> "$GITHUB_ENV"
          '

      - name: Check out the Governor package
        uses: actions/checkout@v7
        with:
          repository: roselabs-io/governor
          token: ${{ env.GOVERNOR_PM_TOKEN }}
          path: .governor-package

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: .governor-package/uv.lock

      # The creation time of the last successful issue-event run; empty when there is none, and the sync then
      # reads the first 100 issues.
      - name: Find the last completed issue sync
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          since=$(gh run list --workflow homebrewtools-pm.yml --event issues --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          echo "HOMEBREWTOOLS_PM_SINCE=$since" >> "$GITHUB_ENV"

      - name: Synchronize GitHub project management metadata
        run: |
          set -o pipefail
          uv run --frozen --no-dev --project .governor-package governor-ticket-sync 2>&1 | tee "$RUNNER_TEMP/homebrewtools-pm.log"

      - name: Report PM sync failure
        if: failure() && (github.event.issue.number || github.event.pull_request.number)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "homebrew-tools PM sync failed."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '~~~text'
            tail -c 5000 "$RUNNER_TEMP/homebrewtools-pm.log" 2>/dev/null || echo "No sync log was produced."
            echo '~~~'
          } > "$RUNNER_TEMP/homebrewtools-pm-comment.md"
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/homebrewtools-pm-comment.md"
