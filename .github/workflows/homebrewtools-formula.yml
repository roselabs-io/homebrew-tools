name: homebrew-tools formula update
run-name: "formula update ${{ github.event.client_payload.tool }} ${{ github.event.client_payload.tag }}"

# A `repository_dispatch` event of type `formula-update` with `client_payload` `{"tool": "<tool>", "tag": "v<X.Y.Z>"}`
# runs `tools/formula_update.py <tool> <tag>`, which rewrites the four `url` and four `sha256` lines of
# `Formula/<tool>.rb` from the release's `checksums.txt`, and regenerates `.secrets.baseline` with detect-secrets 1.5.0
# so that `just secrets` accepts the new `sha256` values. The job commits both files on the branch
# `formula/<tool>-<tag>`, opens a pull request into `main` and enables squash auto-merge on it. The job fails when the
# script fails, and opens no pull request when the formula is already at the tag.
#
# The branch is pushed with `github.token`, which checkout keeps in the git config. The pull request is opened and set
# to auto-merge with `HOMEBREW_TAP_TOKEN`, a secret of the shared Bitwarden project whose id is the organization
# variable `BWS_SHARED_PROJECT_ID`, read with `bws run` (authenticated by the secret `BWS_ACCESS_TOKEN`) only in the
# step that does so: GitHub starts no
# workflow for an event that `github.token` causes, so `homebrewtools-ci.yml` would not run on a pull request opened
# with it. The push of a `formula/**` branch starts no workflow. GitHub merges the pull request when the required
# checks of `main` (`validate`, `Deterministic gate`) pass. Only the branch this job creates is merged this way.
# `repository_dispatch` runs the workflow file of the default branch.

on:
  repository_dispatch:
    types: [formula-update]

concurrency:
  group: homebrewtools-formula-${{ github.event.client_payload.tool }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ${{ fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      TOOL: ${{ github.event.client_payload.tool }}
      TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Rewrite the formula
        run: python3 -B tools/formula_update.py "$TOOL" "$TAG"

      # A one-line `run:` value: detect-secrets reads `secrets==1.5.0` inside a block scalar as a keyword finding.
      - name: Install detect-secrets
        run: pipx install detect-secrets==1.5.0

      # The `generated_at` line of the committed baseline is kept: detect-secrets rewrites it on every scan, and two
      # formula pull requests of different tools would otherwise conflict on that line once one of them merges.
      - name: Regenerate the secret-scan baseline
        shell: bash
        run: |
          if git diff --quiet -- "Formula/$TOOL.rb"; then
            exit 0
          fi
          generated=$(grep '^  "generated_at": ' .secrets.baseline)
          detect-secrets scan --no-verify --exclude-files '^\.secrets\.baseline$' \
            | sed "s|^  \"generated_at\": .*|$generated|" > .secrets.baseline.new
          mv .secrets.baseline.new .secrets.baseline

      # `bws` 2.1.0 for x86_64 Linux, the architecture of `ubuntu-latest`, from the releases of bitwarden/sdk-sm,
      # checked against its SHA-256 and run from $RUNNER_TEMP.
      - name: Install bws
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bws.zip" https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          echo "ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  $RUNNER_TEMP/bws.zip" | sha256sum --check --quiet
          python3 -m zipfile -e "$RUNNER_TEMP/bws.zip" "$RUNNER_TEMP/bws"
          chmod +x "$RUNNER_TEMP/bws/bws"
          echo "$RUNNER_TEMP/bws" >> "$GITHUB_PATH"

      - name: Open a pull request
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ vars.BWS_SHARED_PROJECT_ID }}
        run: |
          if git diff --quiet -- "Formula/$TOOL.rb"; then
            echo "Formula/$TOOL.rb is already at $TAG"
            exit 0
          fi
          # `bws run` runs the script with `sh -c`, where the secrets are set; the variables expand there.
          # shellcheck disable=SC2016
          bws run --project-id "$BWS_PROJECT_ID" -- '
            set -e
            test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is not in the Bitwarden project $BWS_PROJECT_ID"; exit 1; }
            export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
            branch="formula/$TOOL-$TAG"
            git switch -c "$branch"
            git add "Formula/$TOOL.rb" .secrets.baseline
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "chore($TOOL): update the formula to ${TAG#v}"
            git push origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "chore($TOOL): update the formula to ${TAG#v}" \
              --body "Formula/$TOOL.rb: the four url and sha256 lines from https://github.com/roselabs-io/$TOOL/releases/download/$TAG/checksums.txt. .secrets.baseline: regenerated with detect-secrets 1.5.0; review its diff."
            gh pr merge "$branch" --auto --squash
          '
